# Un único RDS PostgreSQL (Patrón 2: Single Database, Multiple Schemas).
# Dentro hay 2 bases, una por MS SQL (clientes_db para MS2, ventas_db para MS4),
# y en cada una un schema por tenant (tenant_andina, tenant_nexo, ...).
#
# Las Lambdas van FUERA de la VPC para no perder salida a SNS/SQS/DynamoDB,
# por eso el RDS es público y protegido por contraseña + SSL. Es una
# simplificación del Learner Lab: en producción irían Lambdas en VPC + endpoints.
#
# Requiere:  $env:CRM_DB_PASSWORD = '<mínimo 8 caracteres, sin / @ " ni espacios>'
service: crm-rds
frameworkVersion: '3'

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'dev'}

resources:
  Resources:
    SgBaseDatos:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: PostgreSQL del CRM (Lambdas fuera de la VPC)
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: 0.0.0.0/0

    BaseDatos:
      Type: AWS::RDS::DBInstance
      DeletionPolicy: Delete
      Properties:
        DBInstanceIdentifier: crm-${sls:stage}
        Engine: postgres
        DBInstanceClass: db.t3.micro
        AllocatedStorage: '20'
        StorageType: gp2
        DBName: postgres
        MasterUsername: crm_admin
        MasterUserPassword: ${env:CRM_DB_PASSWORD}
        PubliclyAccessible: true
        BackupRetentionPeriod: 0
        MultiAZ: false
        VPCSecurityGroups:
          - { Fn::GetAtt: [SgBaseDatos, GroupId] }

  Outputs:
    DbHost:
      Value: { Fn::GetAtt: [BaseDatos, Endpoint.Address] }
